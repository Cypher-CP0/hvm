[package]
name = "vmm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The VMM binary: guest memory, device model and vCPU run loop"

[dependencies]
hypervisor = { path = "../hypervisor" }
libc = "0.2"
thiserror.workspace = true
vm-memory = { version = "0.18", features = ["backend-mmap"] }
linux-loader = { version = "0.14", default-features = false, features = ["bzimage"] }
